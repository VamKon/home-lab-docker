# Docker Compose version
# version: "3-B"
 
networks:
  dns_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.18.0.0/16
 
        
# Define services (containers to be created)
services:
    # Service name: pihole
  pihole:
    # Name of the container instance
    container_name: pihole
 
    # Image to use for this container
    # Use the specified version of the pihole image
    image: pihole/pihole:latest
    hostname: Pihole11
    networks:
      dns_net:
        ipv4_address: 172.18.0.7
 
    # Expose and map ports (host:container)
    ports:
      - "53:53/tcp" # DNS (TCP)
      - "53:53/udp" # DNS (UDP)
      - "9300:443/tcp" #Web UI HTTPS
      - "80:80/tcp" # Web UI HTTP
   
    # Environment variables
    environment:
      TZ: "America/Chicago" # Time Zone; Update this to your time zone
      FTLCONF_webserver_api_password: '${PIHOLE_ADMIN_PASSWORD}' # Admin password for web UI;
      FTLCONF_dns_upstreams: '172.18.0.8#53'
      FTLCONF_dns_listeningMode: 'all'
 
    # Mount volumes for persistent data
    volumes:
      - "/data/pihole/data/pihole:/etc/pihole" # Pi-hole data
      - "/data/pihole/data/dnsmasq:/etc/dnsmasq.d" # dnsmasq data
 
    # Restart policy for the container when it exits
    restart: unless-stopped

    depends_on: 
      - unbound
 
    # # DNS servers for this container to use
    # dns:
    #  - 127.0.0.1 # Unbound internal ip for resolution
    #  - 1.1.1.1 # Cloudflare DNS for external resolution
   
  unbound:
    container_name: unbound
    image: mvance/unbound-rpi:latest # remember to change this if you're not using rpi
    networks:
     dns_net:
        ipv4_address: 172.18.0.8
 
    volumes:
     - "/data/pihole/data/unbound:/etc/unbound" # unbound data
 
     - type: bind
       read_only: true
       source: /home/bmwhd/unbound.conf
       target: /etc/unbound/unbound.conf
    ports:
     - "5053:53/tcp"
     - "5053:53/udp"
 
 
    healthcheck:
      test: ["NONE"]
    restart: unless-stopped